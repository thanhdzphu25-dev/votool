<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Cài đặt AI Answer Helper</title><style>body{max-width:680px;margin:40px auto;padding:0 20px;font:15px system-ui;color:#172018}label{display:block;margin:16px 0 6px;font-weight:600}input,textarea{box-sizing:border-box;width:100%;padding:9px;border:1px solid #b7c4b8;border-radius:6px;font:inherit}textarea{min-height:90px}button{margin-top:18px;padding:10px 18px;border:0;border-radius:6px;background:#14532d;color:#fff;cursor:pointer}#status{margin-left:10px;color:#166534}</style></head>
<body>
  <h1>AI Answer Helper</h1>
  <p>Extension dùng XAH Chat Completions với model Terra. Bấm biểu tượng extension để mở popup, sau đó click 3 lần liên tiếp trong popup để mở trang này.</p>
  <label for="endpoint">XAH endpoint</label><input id="endpoint" type="url" placeholder="https://api.xah.io/v1/chat/completions">
  <label for="apiKey">XAH API key (lưu trong chrome.storage.local)</label><input id="apiKey" type="password" autocomplete="off" placeholder="YOUR_API_KEY">
  <label for="model">Model</label><input id="model" placeholder="dungcsnd113/gpt-5.6-terra">
  <label for="temperature">Temperature</label><input id="temperature" type="number" min="0" max="2" step="0.1">
  <label for="systemPrompt">System prompt</label><textarea id="systemPrompt"></textarea>
  <button id="save">Lưu cấu hình</button><span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
